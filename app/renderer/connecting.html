<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>R&amp;S Sons Accounting</title><style>
html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:#1b2733}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1d5fa8 0,#0b2545 55%,#071729 100%)}
.card{width:420px;max-width:92vw;background:#fff;border-radius:14px;box-shadow:0 25px 60px rgba(0,0,0,.35);padding:30px 34px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{width:58px;height:58px}.brand h1{margin:0;font-size:21px;color:#0b2545}.brand div{color:#66768a;font-size:12px}
.msg{font-size:15px;margin:6px 0 4px;font-weight:600}.sub{color:#66768a;font-size:12.5px;line-height:1.5}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #1d5fa8;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
button{font:inherit;border:1px solid #d7dee7;background:#fff;border-radius:7px;padding:8px 14px;cursor:pointer}button.p{background:#1d5fa8;border-color:#1d5fa8;color:#fff}
button:hover{filter:brightness(.96)}.small{margin-top:14px;font-size:11.5px;color:#66768a;word-break:break-all}.hidden{display:none}
input{font:inherit;border:1px solid #d7dee7;border-radius:6px;padding:7px 9px;width:100%;box-sizing:border-box;margin-top:6px}
.err{color:#c0392b;font-size:12.5px;margin-top:6px}
</style></head><body>
<div class="card"><div class="brand"><img src="../assets/logo.png" alt=""><div><h1>R&amp;S Sons Accounting</h1><div>GST Accounting · Inventory · Payroll</div></div></div>
<div class="msg"><span class="spin"></span><span id="t">Connecting… · जुड़ रहा है</span></div>
<div class="sub" id="s">Online login khul raha hai · opening the online login</div>
<div class="btns hidden" id="b"><button class="p" id="retry">↻ Retry</button><button id="off">💻 Offline mode (sirf is PC pe)</button></div>
<div class="small" id="srv"></div></div>
<script src="shell-pages.js"></script></body></html>
