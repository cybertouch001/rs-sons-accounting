<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob: data:;">
<title>R&amp;S Sons Accounting</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<div id="login" class="hidden"><div class="login-card">
  <div class="brand"><img class="brand-img" src="../assets/logo.png" alt=""><div><h1 id="lname">R&amp;S Sons Accounting</h1><div>GST Accounting · Inventory · Payroll</div></div></div>
  <div id="lmode" class="lmode hidden"></div>
  <form id="loginForm"><div class="fld"><label>Username</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" value=""></div>
  <div class="fld"><label>Password</label><div class="pwrap"><input id="lp" type="password" autocomplete="current-password"><button type="button" class="pweye" id="lpeye" title="Show / hide password" aria-label="Show password">👁</button></div></div>
  <label class="lrem hidden" id="lremw"><input type="checkbox" id="lrem"> Login yaad rakho <span>· stay logged in on this device</span></label>
  <div class="err" id="lerr"></div>
  <button class="btn primary lbtn" id="lbtn" type="submit">Login (Enter)</button></form>
  <div class="lconn hidden" id="lconn"><span class="spin"></span><span id="lconnt">Connecting…</span><button type="button" class="btn sm hidden" id="lretry">↻ Retry</button></div>
  <div style="margin-top:14px;font-size:11.5px;color:var(--muted)" id="lhint" class="hidden">First time? Username <b>admin</b>, password <b>admin</b> — you will be asked to set a new password.</div>
  <button type="button" class="btn hidden" id="lserver" style="margin-top:12px;width:100%;justify-content:center">☁ Online login (data har jagah)</button>
  <div class="lalt hidden" id="lalt"></div>
  <div style="margin-top:6px;font-size:11px;color:var(--muted);opacity:.8" id="lver"></div>
  <div style="margin-top:4px;font-size:11px;color:var(--muted)" id="lweb" class="hidden"></div>
</div></div>
<div id="companies" class="hidden"><div class="comp-card" id="compCard"></div></div>
<div id="app" class="hidden">
  <div id="top"><button class="tbtn" id="tmenu" title="Menu">☰</button><div class="logo"><img class="brand-img" src="../assets/logo.png" alt=""><span id="tappname">R&amp;S Sons Accounting</span></div>
    <div class="cname" id="tcname"></div>
    <span style="font-size:12px;opacity:.8">FY</span><select id="tfy" title="Financial year (F2 changes date)"></select>
    <span style="font-size:12px;opacity:.8">Date</span><input id="tdate" type="date" title="Working date (F2)">
    <span class="user" id="tuser"></span>
    <button class="tbtn" id="tsearch" title="Search party, invoice no., amount (Ctrl+K)">🔍</button>
    <button class="tbtn" id="ttheme" title="Dark / light mode">🌓</button>
    <button class="tbtn" id="tcomp" title="Change company (F1)">🏢 <span class="lbl">Company</span> <kbd style="background:none;color:#ccd;border-color:#456">F1</kbd></button>
    <button class="tbtn" id="tlogout" title="Logout">⏻ <span class="lbl">Logout</span></button></div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <div id="status"></div>
</div>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<div id="combo" class="hidden"></div>
<div id="toast"></div>
<script src="web-api.js"></script>
<script src="../core/util.js"></script>
<script src="../core/calc.js"></script>
<script src="app.js"></script>
<script src="screens.js"></script>
<script src="screens2.js"></script>
<script src="demo.js"></script>
<script src="vouchers.js"></script>
<script src="reports.js"></script>
<script src="automation.js"></script>
</body></html>
